name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values — never production credentials.
  BETTER_AUTH_SECRET: ci-better-auth-secret-not-for-prod-32b
  SEED_PASSWORD: workhub-dev-1
  DATABASE_URL: postgresql://workhub_app:workhub_app@localhost:5432/workhub
  DATABASE_MIGRATION_URL: postgresql://workhub:workhub@localhost:5432/workhub
  APP_URL: http://localhost:3333
  CORS_ORIGINS: http://localhost:3000
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  MAIL_FROM: 'WorkHub <no-reply@workhub.local>'
  STORAGE_ENDPOINT: http://localhost:9000
  STORAGE_REGION: us-east-1
  STORAGE_BUCKET: workhub
  STORAGE_ACCESS_KEY: workhub
  STORAGE_SECRET_KEY: workhubsecret
  STORAGE_PUBLIC_BASE_URL: http://localhost:9000/workhub
  STORAGE_FORCE_PATH_STYLE: 'true'
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3333
  NEXT_PUBLIC_API_PREFIX: api/v1
  CI: true

jobs:
  checks:
    name: Quality + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workhub
          POSTGRES_PASSWORD: workhub
          POSTGRES_DB: workhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhub -d workhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Write server env
        run: bash tools/ci/write-env.sh

      - name: Create app role + migrate
        run: |
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f docker/postgres/init/01-app-role.sql
          pnpm db:migrate

      - name: Quality (no commit gate)
        # Review / in-progress state is local; CI must not use --gate.
        run: pnpm quality

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workhub
          POSTGRES_PASSWORD: workhub
          POSTGRES_DB: workhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhub -d workhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Write env files
        run: bash tools/ci/write-env.sh --with-client

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Start MinIO
        run: |
          docker compose --env-file apps/server/.env up -d minio minio-init
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          exit 1

      - name: Create app role + migrate + seed
        run: |
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f docker/postgres/init/01-app-role.sql
          pnpm db:migrate
          pnpm db:seed

      - name: Build apps
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm nx e2e @work-hub/client-e2e
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3333
          MAILPIT_URL: http://localhost:8025
          SEED_PASSWORD: workhub-dev-1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/client-e2e/test-output
            apps/client-e2e/playwright-report
            test-output
          if-no-files-found: ignore
          retention-days: 7
