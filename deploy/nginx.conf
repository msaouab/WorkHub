# WorkHub: one origin — Next.js web app + NestJS API behind nginx.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;
    server_tokens off;

    # NestJS API (versioned prefix) and health probes
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3333;
        include /etc/nginx/proxy_params;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:3333;
        include /etc/nginx/proxy_params;
    }

    # Next.js static assets are content-hashed: cache hard
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else: Next.js (pages, its own /api routes, images)
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
