services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: workhub, POSTGRES_PASSWORD: workhub, POSTGRES_DB: workhub }
    # Host 5432 is often taken by a local Homebrew/Postgres.app install.
    ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
  mailpit:                       # catches every email the app sends; view them at http://localhost:8025
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
  adminer:                       # view the database at http://localhost:8083
    image: adminer
    ports: ["8083:8080"]  # 8080 taken by hypertube-nginx locally
    environment: { ADMINER_DEFAULT_SERVER: postgres, ADMINER_PASSWORD: workhub, ADMINER_USER: workhub }
    depends_on: [postgres]

volumes: { pgdata: {} }
