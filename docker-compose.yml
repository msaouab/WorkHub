services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: workhub, POSTGRES_PASSWORD: workhub, POSTGRES_DB: workhub }
    # Host 5432 is often taken by a local Homebrew/Postgres.app install.
    ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
  mailpit:                       # catches every email the app sends; view them at http://localhost:8025
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
  adminer:                       # view the database at http://localhost:8083
    image: adminer
    ports: ["8083:8080"]  # 8080 taken by hypertube-nginx locally
    environment: { ADMINER_DEFAULT_SERVER: postgres }
    depends_on: [postgres]
  minio:                         # S3-compatible object storage (WH-047); console :9001
    # Official minio/minio + minio/mc were removed from Docker Hub / Quay (2026-09):
    # https://github.com/minio/minio/issues/21647
    # pgsty/silo is an API-compatible community fork (same MINIO_* env + volume layout).
    image: pgsty/silo@sha256:aaac6bce13eb99316b3c88bd20143fc3c38ab607585256a411a095c44ee57f62
    command: server /data --console-address ":9001"
    # Credentials from STORAGE_* (apps/server/.env) — see README `docker compose --env-file`
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-workhub}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-workhubsecret}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  minio-init:                    # create the public-read (GetObject only) branding bucket once
    image: pgsty/mc@sha256:6ecdaec70bc5e8cf9d0e9a70c190f3beb1c83f11617ff4333f1fcd71ab1daf18
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-workhub}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-workhubsecret}
      # Policy file is hard-coded to bucket `workhub` (mc image has no sed).
      STORAGE_BUCKET: workhub
    volumes:
      - ./docker/minio/anonymous-get-object.json:/policy.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$STORAGE_ACCESS_KEY\" \"$$STORAGE_SECRET_KEY\" &&
      mc mb --ignore-existing local/workhub &&
      mc anonymous set-json /policy.json local/workhub &&
      mc anonymous get-json local/workhub
      "

volumes: { pgdata: {}, miniodata: {} }
